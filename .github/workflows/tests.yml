name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invoiceflow
          POSTGRES_DB: invoiceflow_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceflow -d invoiceflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INVOICEFLOW_TEST_POSTGRES_HOST: localhost
      INVOICEFLOW_TEST_POSTGRES_PORT: "5432"
      INVOICEFLOW_TEST_POSTGRES_USER: invoiceflow
      INVOICEFLOW_TEST_POSTGRES_DB: invoiceflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m pytest -m postgres -q
      - run: ruff check .
      - run: ruff format --check .
